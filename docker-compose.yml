version: '3.8'
services:
  mongo:
    image: mongo:latest
    container_name: swasthayogi-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./Backend
    container_name: swasthayogi-backend
    ports:
      - "3000:3000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/swasthayogi
    depends_on:
      - mongo
    restart: unless-stopped

  frontend:
    build: ./FrontEnd_Angular
    container_name: swasthayogi-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongo-data:
