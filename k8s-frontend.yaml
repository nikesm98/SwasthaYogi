apiVersion: apps/v1
kind: Deployment
metadata:
  name: swasthayogi-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: swasthayogi-frontend
  template:
    metadata:
      labels:
        app: swasthayogi-frontend
    spec:
      containers:
        - name: frontend
          image: nikhilsm23/swasthayogi-frontend:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: swasthayogi-frontend
spec:
  type: NodePort
  selector:
    app: swasthayogi-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080
